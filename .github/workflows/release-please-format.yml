name: release-please-format

on:
  pull_request_target:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

jobs:
  format-release-metadata:
    if: startsWith(github.event.pull_request.head.ref, 'release-please--branches--master--components--preludejs')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format release metadata
        run: bunx biome format package.json jsr.json --write

      - name: Commit formatted metadata
        run: |
          if git diff --quiet -- package.json jsr.json; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add package.json jsr.json
          git commit -m "chore(release): format release metadata"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
